<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chinese New Year Cookies — USC CG Final</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #overlay h1 {
            color: #f2bf3f;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        #overlay p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            pointer-events: none;
            line-height: 1.5;
            z-index: 10;
        }

        #ui span {
            color: #f2bf3f;
            font-weight: 500;
        }

        .hidden {
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h1>Loading Chinese New Year Cookies…</h1>
        <p>Generating models with Three.js…</p>
    </div>

    <div id="ui" class="hidden">
        <span>USC Computer Graphics — Final Project</span><br>
        Drag to rotate · Scroll to zoom · Right-click to pan
    </div>

    <div id="canvas-container"></div>


    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Our Project Code -->
    <script src="../code/main.js"></script>

</body>

</html>
